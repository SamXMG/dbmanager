name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies (consumes requirements.lock, 路线图 1.3)
        # mypy 固定 1.14.1: 2.x 有 gitignore 扫描 INTERNAL ERROR(路线图 P1-4 验证时发现)
        run: pip install -r requirements.lock pyflakes ruff mypy==1.14.1 pytest
      # pyodbc/oracledb 依赖按平台条件安装(requirements.lock 已声明);
      # 本 job 的单测/e2e 只使用 SQLite, 无需真实数据库驱动;
      # 真实 MySQL/PostgreSQL 由独立 job backend-multidb 用 service container 背书
      - name: Static check (ruff F+E9, 与 pyflakes 语义对齐)
        shell: bash
        run: |
          ruff check --select F,E9 . 2>&1 | tail -20
          python -m pyflakes *.py routes/*.py services/*.py tests/*.py 2>&1 | grep -i "undefined" && exit 1 || exit 0
      - name: Format check (ruff format, 纯增量门禁; 存量 53 文件待对齐)
        continue-on-error: true   # 收敛命令: ruff format .(本地跑一次即对齐, 对齐后可移除本行转硬门禁)
        shell: bash
        run: ruff format --check .
      - name: Type check (mypy 1.14.1, 路线图 P1-4: 5 文件已收敛 0 error, 转硬门禁)
        run: mypy scanner.py handler_security.py services/core.py config.py dbcore.py
      - name: Import integrity (no circular imports)
        run: python -c "import app; print('import app OK')"
      - name: Unit tests (pytest + coverage, 路线图 P1-5)
        # 门槛随 M2 补测试逐里程碑抬升: 15%(基线)→30→45→60; 实测已 67%, 钉死 60 防回退
        run: python -m pytest tests/ -q --cov=services --cov=routes --cov-report=xml --cov-fail-under=60
      - name: HTTP full-chain smoke (real server + SQLite)
        run: python tests/e2e_http_smoke.py 18777
        env:
          # 强制改密(P0-1)后: 默认 admin 命中 must_change_pwd 会 403 拦全部 e2e, 必须用非默认口令起库
          DBM_DEFAULT_PWD: CiRand0mPwd#2026
      - name: Security E2E (auth / account / ACL / SQL 工作台 / EXPLAIN / SSRF)
        shell: bash
        env:
          DBM_DEFAULT_PWD: CiRand0mPwd#2026
        run: |
          python app.py > /tmp/dbm_server.log 2>&1 &
          SERVER_PID=$!
          sleep 4
          python tests/e2e_auth.py || { kill $SERVER_PID 2>/dev/null; exit 1; }
          python tests/e2e_acct.py || { kill $SERVER_PID 2>/dev/null; exit 1; }
          python tests/e2e_acl.py || { kill $SERVER_PID 2>/dev/null; exit 1; }
          python tests/e2e_p0_ssrf.py || { kill $SERVER_PID 2>/dev/null; exit 1; }
          python tests/e2e_sql_workbench.py || { kill $SERVER_PID 2>/dev/null; exit 1; }
          python tests/e2e_stage5.py || { kill $SERVER_PID 2>/dev/null; exit 1; }
          python tests/e2e_stage5b.py || { kill $SERVER_PID 2>/dev/null; exit 1; }
          python tests/e2e_explain.py || { kill $SERVER_PID 2>/dev/null; exit 1; }
          kill $SERVER_PID 2>/dev/null || true
      - name: Dependency vulnerability scan (pip-audit, 基于 lock 锁定集)
        continue-on-error: true   # 发现即报告, 不阻塞发版(修复依赖由维护者处理)
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock --timeout 60

  backend-multidb:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: dbm_test
          MYSQL_USER: dbm
          MYSQL_PASSWORD: dbm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dbm_test
          POSTGRES_USER: dbm
          POSTGRES_PASSWORD: dbm
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dbm -d dbm_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies (consumes requirements.lock)
        run: pip install -r requirements.lock pytest
      - name: Wait for databases (端口就绪后再测)
        run: |
          for port in 3306 5432; do
            echo "waiting for 127.0.0.1:$port ..."
            for i in $(seq 1 30); do
              if (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null; then
                echo "port $port ready"; break
              fi
              sleep 1
            done
          done
          sleep 3
      - name: Multi-DB core path tests (MySQL + PostgreSQL)
        env:
          DBM_TEST_MYSQL_URL: mysql+pymysql://dbm:dbm@127.0.0.1:3306/dbm_test
          DBM_TEST_PG_URL: postgresql+pg8000://dbm:dbm@127.0.0.1:5432/dbm_test
        run: python -m pytest tests/multidb_core.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests (vitest, core logic: 注入防护/格式化)
        run: npm run test
      - name: Type check (vue-tsc)
        run: npm run typecheck
      - name: Lint (ESLint, 路线图 P1-3; 存量警告预算 200, M2 收敛后收紧到 0)
        run: npx eslint . --max-warnings 200
      - name: Build
        run: npm run build
      - name: Dependency vulnerability scan (npm audit, production deps only)
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t dbmanager .
      - name: Import smoke (P0-1: sqlitedb/metrics 已随镜像 COPY, docker run 不再缺模块)
        run: docker run --rm dbmanager python -c "import app; print('docker import app OK')"
