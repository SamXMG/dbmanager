<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>DB Manager 文档</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DB Manager —— 多数据库管理工具文档（简体中文 / English）" />
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
</head>
<body>
  <div id="app">文档加载中…</div>
  <script>
    window.$docsify = {
      name: 'DB Manager',
      repo: 'SamXMG/dbmanager',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 2,
      auto2top: true,
      maxLevel: 4,
      homepage: 'README.md',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: { '/': '搜索文档…', '/en/': 'Search docs…' },
        noData: { '/': '找不到结果', '/en/': 'No results' },
        depth: 4,
      },
      // i18n：中文为默认语言，/en/ 为英文
      locales: {
        '/': {
          name: '简体中文',
          sidebar: { '/': '_sidebar.md' },
          navbar: { '/': '_navbar.md' },
        },
        '/en/': {
          name: 'English',
          sidebar: { '/en/': 'en/_sidebar.md' },
          navbar: { '/en/': 'en/_navbar.md' },
        },
      },
      fallbackLanguages: ['/'],
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
</body>
</html>
